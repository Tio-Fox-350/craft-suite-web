name: Deploy Craft App Suite Portal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare clean production directory
        run: |
          mkdir -p _site
          cp index.html _headers _site/
          for dir in *-web-*; do
            if [ -d "$dir" ]; then
              mkdir -p "_site/$dir"
              rsync -a \
                --exclude='.fingerprint' \
                --exclude='build' \
                --exclude='deps' \
                --exclude='incremental' \
                --exclude='.cargo*' \
                --exclude='*.br' \
                --exclude='*.gz' \
                "$dir/" "_site/$dir/"
            fi
          done
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
